name: generate contribution graphs

on:
  schedule:
    - cron: "0 0 * * *" # every day at 00:00 UTC (07:00 WIB)
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: generate pac-man & breakout graphs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,breakout"

      - name: generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: collect 3D SVGs
        run: sudo cp profile-3d-contrib/*.svg dist/

      - name: make arcade SVGs responsive
        # pac-man/breakout ship a fixed width and no viewBox, so they get cropped instead of scaled
        run: |
          sudo python3 - <<'PY'
          import glob, re
          for f in glob.glob("dist/pacman-*.svg") + glob.glob("dist/breakout-*.svg"):
              s = open(f).read()
              head = re.search(r"<svg\b[^>]*>", s).group(0)
              if "viewBox" in head:
                  continue
              w = re.search(r'\bwidth="([\d.]+)', head).group(1)
              h = re.search(r'\bheight="([\d.]+)', head).group(1)
              open(f, "w").write(s.replace(head, head[:-1] + f' viewBox="0 0 {w} {h}">', 1))
              print("fixed", f, w, h)
          PY

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
